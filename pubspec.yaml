name: hicoach_coach
description: "A new Flutter project."

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.7.2
  flutter_screenutil: ^5.9.3
  flutter_dotenv: ^6.0.0
  http: ^1.6.0
  image_picker: ^1.2.1
  intl: ^0.20.2
  google_fonts: ^6.3.2
  flutter_secure_storage: ^9.2.4
  flutter_native_splash: ^2.4.7
  loading_overlay: ^0.5.0
  flutter_spinkit: ^5.2.2
  shared_preferences: ^2.5.3
  mailer: ^6.6.0
  country_picker: ^2.0.27
  card_swiper: ^3.0.1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  lottie: ^3.3.1
  syncfusion_flutter_calendar: ^31.1.19
  table_calendar: ^3.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/images/logo.png
  branding: assets/images/tagline.png
  branding_mode: bottom
  android_12:
    image: assets/images/logo.png
    icon_background_color: "#FFFFFF"
    branding: assets/images/tagline.png

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/icons/navigations/
    - assets/json/
    - .env
